# Runs the dev stack as one supervised group, so starting and (crucially)
# stopping are a single action — no orphaned servers left on stray ports.
#
#   process-compose up      # start API + SPA; press q / Ctrl-C to stop both
#
# Requires the dev shell (ffmpeg + Node 24 on PATH): `nix develop` or direnv.
version: "0.5"

processes:
  api:
    command: npm run dev:server
    # The SPA's Vite proxy forwards /api to this server; gate `web` on this
    # probe so Vite doesn't start (and log ECONNREFUSED) before the API listens.
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 8080
        path: /api/setup
      initial_delay_seconds: 1
      period_seconds: 1
      failure_threshold: 30
    # Bring the API back if it dies, rather than leaving `web` up and proxying
    # to nothing until someone notices. Give up after a handful of tries, so a
    # genuinely broken state (a port already in use, say) fails loudly instead
    # of looping forever.
    #
    # This covers the watcher itself going down. It does NOT cover the server
    # `tsx watch` spawns dying while the watcher lives on: process-compose then
    # still sees a healthy process, the readiness probe reports Not Ready, and
    # nothing acts on it — `process-compose process restart api` is the fix.
    # A `liveness_probe` detects exactly that case and was tried here, but
    # process-compose cannot terminate `tsx watch` cleanly, so the restart it
    # triggers wedges the process in `Terminating` indefinitely — worse than
    # the problem. Revisit if the dev server stops being run under a watcher.
    availability:
      restart: "on_failure"
      backoff_seconds: 2
      max_restarts: 5

  web:
    command: npm run dev:web
    depends_on:
      api:
        condition: process_healthy
    availability:
      restart: "no"
