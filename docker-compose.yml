# Single-container deployment. videocastle listens on plain HTTP; terminate TLS
# at your own reverse proxy and forward to this service (set COOKIE_SECURE=true).
services:
  videocastle:
    build: .
    ports:
      # Container side is fixed; the host side is yours to choose. A VPS that
      # already runs something on 8080 — another service, a reverse proxy —
      # otherwise fails to start with a bind error that reads like a crash.
      # Override with HOST_PORT in a .env beside this file, or in the shell.
      - '${HOST_PORT:-8080}:8080'
    environment:
      DATA_DIR: /data
      # COOKIE_SECURE: 'true'            # set when a reverse proxy terminates TLS
      # SESSION_SECRET: change-me        # optional: override the auto-generated secret
      # MAX_UPLOAD_BYTES: '2147483648'   # largest accepted upload (bytes); ~2 GB default
      # RATE_LIMIT_MAX: '600'            # per-IP viewer request ceiling per window
      # RATE_LIMIT_PASSWORD_MAX: '10'    # per-IP password-attempt ceiling per window
      # STORAGE_QUOTA_BYTES: '200GiB'    # ceiling on total media; unlimited when unset
      # MIN_FREE_DISK_BYTES: '1GiB'      # free space to keep on the media filesystem
      # QUOTA_WARN_PERCENT: '80'         # where the storage warning band starts
      # TRANSCODE_CONCURRENCY: '1'       # parallel transcodes; lower to share the host
      # FFMPEG_THREADS: '2'              # -threads per transcode; caps CPU per job
      # KEEP_SOURCE_AFTER_TRANSCODE: 'false'  # drop originals after transcoding (forward-only)
    volumes:
      # Media, SQLite, and the session secret persist here across restarts.
      - videocastle-data:/data
    restart: unless-stopped

volumes:
  videocastle-data:
